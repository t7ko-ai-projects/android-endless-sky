plugins {
   id 'com.android.application'
}

android {
    namespace = "com.github.thewierdnut.endless_mobile"
    compileSdkVersion 30
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    ndkVersion "26.3.11579264"
    defaultConfig {
        applicationId "io.github.t7ko_ai_projects.endless_sky"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 63
        versionName "0.11.4-63"
        externalNativeBuild {
            // ndkBuild {
            //     arguments "APP_PLATFORM=android-18"
            //     abiFilters 'arm64-v8a'
            //     // abiFilters 'armeabi-v7a', 'arm64-v8a'
            // }
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-18", "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release", "-DSDL_SHARED=0"
                // Each abi we enable increases the apk size by 20 meg
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            // ndkBuild {
            //     path 'jni/Android.mk'
            // }
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }

    }
    lintOptions {
        abortOnError false
    }

    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    //packagingOptions{
    //    doNotStrip "*/*/*.so"
    //}

    signingConfigs {
        debug
        {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists())
            localPropertiesFile.withInputStream { localProperties.load(it) }
        if (localProperties.getProperty('release.storeFile') != null)
        {
            release
            {
                storeFile file(localProperties.getProperty('release.storeFile'))
                storePassword file(localProperties.getProperty('release.storePasswordFile')).text.trim()
                keyAlias localProperties.getProperty('release.keyAlias')
                keyPassword storePassword
            }
            // Without the key in local.properties, release builds come out unsigned.
            buildTypes.release.signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}